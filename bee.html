<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bee Scroll Animation</title>
  <style>
    @font-face {
      font-display: block;
      font-family: Mori;
      font-style: normal;
      font-weight: 400;
      src: url(https://assets.codepen.io/16327/PPMori-Regular.woff) format("woff");
    }

    body {
      width: 100%;
      height: 400vh;
      background: #FFFBF6;
      color: white;
      font-family: "Mori", sans-serif;
      margin: 0;
    }

    .header-section {
      position: relative;
      text-align: center;
      margin: 100px auto 0;
      font-size: 24px;
    }

    #svg-stage {
      max-width: 600px;
      overflow: visible;
      margin: 0 auto;
      margin-top: 60vh;
      display: block;
    }

    .bee {
      visibility: hidden;
    }

    .theLine {
      fill: none;
      stroke: white;
      stroke-width: 4px;
    }
  </style>
</head>
<body>

  

  <svg id="svg-stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200">
    <path class="theLine" 
      d="M -5,0
         Q 450 230 300 450 
         T 130 750
         Q 100 850 300 1000
         T 150 1200"
    />
    <!-- Replace circle with bee image -->
    <image 
      class="bee" 
      href="static/img/loading.gif" 
      width="80" 
      height="80" 
      x="0" 
      y="0"
    />
  </svg>

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>

  <script>
    console.clear();

    gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);
    gsap.defaults({ ease: "none" });

    gsap.set(".bee", { autoAlpha: 0 });

    gsap.timeline({
      scrollTrigger: {
        trigger: "#svg-stage",
        scrub: true,
        start: "top center",
        end: "bottom center"
      }
    })
    .to(".bee", { duration: 0.01, autoAlpha: 1 })
    .to(".bee", {
      motionPath: {
        path: ".theLine",
        align: ".theLine",
        alignOrigin: [0.5, 0.5],
        
        autoRotate: true +90
      }
    });
  </script>
</body>
</html>
